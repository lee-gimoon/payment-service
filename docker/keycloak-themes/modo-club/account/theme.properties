# 계정 설정 화면(Keycloak 계정 콘솔). 기본 계정 테마(keycloak.v3)의 화면 구조는 그대로 쓰고,
# 스토어와 같은 색·카드·버튼과 MODO CLUB 로고만 덧입힌다.
parent=keycloak.v3

styles=css/modo-account.css
# 브라우저 탭 제목 "MODO CLUB 계정 설정". theme.properties는 ASCII로 읽힐 수 있어 한글은 유니코드 이스케이프로 적는다.
title=MODO CLUB \uACC4\uC815 \uC124\uC815

logo=img/modo-logo.svg
# 로고를 누르면 스토어로 돌아간다. 운영 이미지는 docker/keycloak.Dockerfile이 realm의 스토어 주소와 함께 실제 주소로 바꾼다.
logoUrl=http://127.0.0.1:5173/

# 스토어에 다크 모드가 없으므로 계정 화면도 밝은 화면으로 고정한다.
darkMode=false
