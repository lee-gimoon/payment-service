<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
  <title id="title">Spring 서버 하나에 있는 HTTP 주소, WebSocket 주소, 연결 안의 채널</title>
  <desc id="desc">브라우저는 같은 localhost:8080 서버에 HTTP 경로와 WebSocket 입구 /ws로 접속한다. /user/queue/chat과 /topic/admin/chat 채널은 /ws 연결 안에만 있다.</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
      .sub { font-size: 12px; fill: #5F5E5A; }
      .purple .title { fill: #3C3489; }
      .purple .sub { fill: #534AB7; }
      .teal .title { fill: #085041; }
      .teal .sub { fill: #0F6E56; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="679" height="409" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

  <rect x="40" y="96" width="140" height="254" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text class="title" x="110" y="118" text-anchor="middle" dominant-baseline="central">브라우저</text>
  <text class="sub" x="110" y="138" text-anchor="middle" dominant-baseline="central">고객 화면</text>

  <rect x="220" y="30" width="420" height="340" rx="20" fill="#FAF9F6" stroke="#B4B2A9" stroke-width="0.8"/>
  <text class="title" x="240" y="56" dominant-baseline="central">Spring 서버</text>
  <text class="sub" x="240" y="76" dominant-baseline="central">localhost:8080 · 서버는 하나</text>

  <g class="purple">
    <rect x="240" y="96" width="380" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
    <text class="title" x="430" y="118" text-anchor="middle" dominant-baseline="central">http://localhost:8080/chat/messages</text>
    <text class="sub" x="430" y="140" text-anchor="middle" dominant-baseline="central">HTTP: 요청 한 번에 응답 한 번</text>
  </g>

  <g class="teal">
    <rect x="240" y="180" width="380" height="170" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text class="title" x="430" y="202" text-anchor="middle" dominant-baseline="central">ws://localhost:8080/ws</text>
    <text class="sub" x="430" y="222" text-anchor="middle" dominant-baseline="central">WebSocket 입구: 연결을 열어 둔 채 유지</text>

    <rect x="256" y="246" width="164" height="84" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/>
    <text class="title" x="338" y="276" text-anchor="middle" dominant-baseline="central">/user/queue/chat</text>
    <text class="sub" x="338" y="300" text-anchor="middle" dominant-baseline="central">연결 안의 고객 채널</text>

    <rect x="440" y="246" width="164" height="84" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/>
    <text class="title" x="522" y="276" text-anchor="middle" dominant-baseline="central">/topic/admin/chat</text>
    <text class="sub" x="522" y="300" text-anchor="middle" dominant-baseline="central">연결 안의 관리자 채널</text>
  </g>

  <line x1="180" y1="128" x2="236" y2="128" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <line x1="184" y1="265" x2="236" y2="265" stroke="#1D9E75" stroke-width="2.5" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>

  <text class="sub" x="340" y="392" text-anchor="middle" dominant-baseline="central">보라: HTTP 요청-응답 · 청록: WebSocket 연결과 그 안의 채널</text>
</svg>
