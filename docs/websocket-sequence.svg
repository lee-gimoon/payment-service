<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" aria-labelledby="title desc">
  <title id="title">브라우저와 Spring 서버가 HTTP 요청과 STOMP 프레임을 주고받는 순서</title>
  <desc id="desc">지난 대화 조회 HTTP 요청, /ws 핸드셰이크, 열린 연결 안의 CONNECT와 SUBSCRIBE 프레임, 메시지 보내기 POST 요청, 서버가 먼저 보내는 MESSAGE 프레임 순서.</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
      .sub { font-size: 12px; fill: #5F5E5A; }
      .http { stroke: #7F77DD; stroke-width: 1.5; }
      .frame { stroke: #1D9E75; stroke-width: 1.5; }
      .lifeline { stroke: #888780; stroke-width: 0.8; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="679" height="639" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

  <rect x="80" y="30" width="140" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text class="title" x="150" y="50" text-anchor="middle" dominant-baseline="central">브라우저</text>
  <rect x="430" y="30" width="200" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text class="title" x="530" y="50" text-anchor="middle" dominant-baseline="central">Spring (localhost:8080)</text>

  <line class="lifeline" x1="150" y1="70" x2="150" y2="596"/>
  <line class="lifeline" x1="530" y1="70" x2="530" y2="596"/>
  <rect x="145" y="252" width="10" height="334" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
  <rect x="525" y="252" width="10" height="334" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>

  <text class="sub" x="340" y="98" text-anchor="middle" dominant-baseline="central">GET http://localhost:8080/chat/messages</text>
  <line class="http" x1="152" y1="112" x2="526" y2="112" marker-end="url(#arrow-purple)"/>
  <text class="sub" x="340" y="138" text-anchor="middle" dominant-baseline="central">200 지난 대화 — 여기서 끝</text>
  <line class="http" x1="528" y1="152" x2="154" y2="152" marker-end="url(#arrow-purple)"/>

  <text class="sub" x="340" y="188" text-anchor="middle" dominant-baseline="central">GET ws://localhost:8080/ws (Upgrade)</text>
  <line class="frame" x1="152" y1="202" x2="526" y2="202" marker-end="url(#arrow-teal)"/>
  <text class="sub" x="340" y="228" text-anchor="middle" dominant-baseline="central">101 연결 전환 — 끊지 않고 유지</text>
  <line class="frame" x1="528" y1="242" x2="154" y2="242" marker-end="url(#arrow-teal)"/>

  <text class="sub" x="136" y="270" text-anchor="end" dominant-baseline="central">연결 유지</text>
  <text class="sub" x="544" y="270" dominant-baseline="central">연결 유지</text>

  <text class="sub" x="340" y="296" text-anchor="middle" dominant-baseline="central">CONNECT (로그인 토큰)</text>
  <line class="frame" x1="157" y1="310" x2="521" y2="310" marker-end="url(#arrow-teal)"/>
  <text class="sub" x="340" y="336" text-anchor="middle" dominant-baseline="central">CONNECTED</text>
  <line class="frame" x1="523" y1="350" x2="159" y2="350" marker-end="url(#arrow-teal)"/>

  <text class="sub" x="340" y="376" text-anchor="middle" dominant-baseline="central">SUBSCRIBE /user/queue/chat</text>
  <line class="frame" x1="157" y1="390" x2="521" y2="390" marker-end="url(#arrow-teal)"/>
  <text class="sub" x="544" y="390" dominant-baseline="central">명단에 기록</text>

  <text class="sub" x="340" y="426" text-anchor="middle" dominant-baseline="central">POST http://localhost:8080/chat/messages</text>
  <line class="http" x1="157" y1="440" x2="521" y2="440" marker-end="url(#arrow-purple)"/>
  <text class="sub" x="544" y="440" dominant-baseline="central">DB 저장</text>
  <text class="sub" x="340" y="466" text-anchor="middle" dominant-baseline="central">201 저장된 내 메시지</text>
  <line class="http" x1="523" y1="480" x2="159" y2="480" marker-end="url(#arrow-purple)"/>

  <text class="sub" x="340" y="516" text-anchor="middle" dominant-baseline="central">MESSAGE /user/queue/chat (관리자 답장)</text>
  <line class="frame" x1="523" y1="530" x2="159" y2="530" marker-end="url(#arrow-teal)"/>
  <text class="sub" x="544" y="530" dominant-baseline="central">답장 저장 후</text>
  <text class="sub" x="340" y="556" text-anchor="middle" dominant-baseline="central">MESSAGE (다음 답장도 계속)</text>
  <line class="frame" x1="523" y1="570" x2="159" y2="570" marker-end="url(#arrow-teal)"/>

  <text class="sub" x="340" y="618" text-anchor="middle" dominant-baseline="central">보라: 주소로 보내는 HTTP 요청-응답 · 청록: /ws 연결과 그 안에서 오가는 프레임</text>
</svg>
