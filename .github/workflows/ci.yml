# 푸시와 PR마다 백엔드·프런트엔드 테스트와 빌드를 돌린다.
# Railway 서비스의 "Wait for CI"를 켜 두면 이 검사가 통과한 커밋만 배포된다(docs/deployment.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 다시 푸시하면 이전 실행은 취소하고 최신 커밋만 검사한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # 통합 테스트는 Testcontainers로 PostgreSQL을 띄운다. GitHub의 ubuntu 실행기에는 Docker가 있다.
      - run: ./gradlew test bootJar
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: build/reports/tests/test/

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
