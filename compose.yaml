services:
  postgres:
    image: postgres:18-alpine
    container_name: payment-service-postgres
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - payment-service-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: payment-service-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@payment-service.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-payment_admin_local}
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgadmin4/pgpass
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - payment-service-pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: payment-service-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: payment
      KC_DB_PASSWORD: payment_local
      KC_HOSTNAME: http://127.0.0.1:8081
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      - ./docker/keycloak-themes/modo-club:/opt/keycloak/themes/modo-club:ro

volumes:
  payment-service-postgres-data:
  payment-service-pgadmin-data:
